        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberDto'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClanMember'
        '400':
          description: User already in a clan or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clan or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clan/{id}/members/{userId}:
    delete:
      operationId: clan_removeMember
      tags: [clan]
      summary: Remove a user from the clan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed — no content
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clan or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clan/{id}/members/{userId}/role:
    patch:
      operationId: clan_promoteMember
      tags: [clan]
      summary: Promote or demote a clan member (member / officer / leader)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteMemberDto'
      responses:
        '200':
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClanMember'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clan or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clan/{id}/wars:
    get:
      operationId: clan_getWars
      tags: [clan]
      summary: Get war history for a clan (as attacker and defender)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clan war history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    attackerClanId:
                      type: string
                      format: uuid
                    defenderClanId:
                      type: string
                      format: uuid
                    status:
                      type: string
                      enum: [pending, active, completed]
                    winnerId:
                      type: string
                      format: uuid
                      nullable: true
                    startedAt:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clan/wars:
    post:
      operationId: clan_createWar
      tags: [clan]
      summary: Declare a new clan war between two clans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attackerClanId
                - defenderClanId
              properties:
                attackerClanId:
                  type: string
                  format: uuid
                defenderClanId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Clan war declared
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  attackerClanId:
                    type: string
                    format: uuid
                  defenderClanId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending, active, completed]
        '400':
          description: Invalid clans or war already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: One or both clans not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
