# K8s Secrets Template for KingdomsOfWar
# DO NOT commit real values — copy to secrets.yaml and populate, then apply:
#   kubectl apply -f k8s/secrets.yaml -n kingdoms-of-war
#
# Generate base64: echo -n "value" | base64

apiVersion: v1
kind: Secret
metadata:
  name: kowadmin-secrets
  namespace: kingdoms-of-war
type: Opaque
data:
  # Database
  DATABASE_URL: REPLACE_WITH_BASE64_DATABASE_URL
  # Redis
  REDIS_URL: REPLACE_WITH_BASE64_REDIS_URL
  # JWT
  JWT_SECRET: REPLACE_WITH_BASE64_JWT_SECRET
  JWT_REFRESH_SECRET: REPLACE_WITH_BASE64_JWT_REFRESH_SECRET
  # Firebase (push notifications)
  FIREBASE_PROJECT_ID: REPLACE_WITH_BASE64_FIREBASE_PROJECT_ID
  FIREBASE_CLIENT_EMAIL: REPLACE_WITH_BASE64_FIREBASE_CLIENT_EMAIL
  FIREBASE_PRIVATE_KEY: REPLACE_WITH_BASE64_FIREBASE_PRIVATE_KEY
  # AWS (S3 assets)
  AWS_ACCESS_KEY_ID: REPLACE_WITH_BASE64_AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_BASE64_AWS_SECRET_ACCESS_KEY
  AWS_S3_BUCKET: REPLACE_WITH_BASE64_AWS_S3_BUCKET
  # Stripe (payments)
  STRIPE_SECRET_KEY: REPLACE_WITH_BASE64_STRIPE_SECRET_KEY
  STRIPE_WEBHOOK_SECRET: REPLACE_WITH_BASE64_STRIPE_WEBHOOK_SECRET
  # Sentry
  SENTRY_DSN: REPLACE_WITH_BASE64_SENTRY_DSN
  # Admin defaults
  ADMIN_DEFAULT_EMAIL: REPLACE_WITH_BASE64_ADMIN_DEFAULT_EMAIL
  ADMIN_DEFAULT_PASSWORD: REPLACE_WITH_BASE64_ADMIN_DEFAULT_PASSWORD
  # NextAuth
  NEXTAUTH_SECRET: REPLACE_WITH_BASE64_NEXTAUTH_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: kowadmin-regcred
  namespace: kingdoms-of-war
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKER_CONFIG_JSON
