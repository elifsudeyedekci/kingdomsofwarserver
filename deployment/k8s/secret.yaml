apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: kingdoms-of-war
type: Opaque
stringData:
  DATABASE_URL: "postgresql://kowuser:PLACEHOLDER_PASSWORD@postgres:5432/kingdoms_of_war?schema=public"
  JWT_SECRET: "PLACEHOLDER_JWT_SECRET_CHANGE_IN_PRODUCTION"
  REDIS_URL: "redis://redis:6379"
  NEXTAUTH_SECRET: "PLACEHOLDER_NEXTAUTH_SECRET_CHANGE_IN_PRODUCTION"
  POSTGRES_PASSWORD: "PLACEHOLDER_POSTGRES_PASSWORD"
