apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-backend-hpa
  namespace: kingdoms-of-war
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-panel-hpa
  namespace: kingdoms-of-war
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-panel
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
