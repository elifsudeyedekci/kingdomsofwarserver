# KoW production stack for one Contabo VPS. Run from this folder:  docker compose --env-file .env.production up -d --build
# Only Caddy (80/443) is published. Postgres, Redis, backend and panel are reachable only on the internal network.
name: kow
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: kingdoms_of_war
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kow -d kingdoms_of_war"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env.production}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 5s, timeout: 3s, retries: 20 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    networks: [internal]

  migrate:                       # runs once per `up`: applies database migrations
    build: { context: ../.., dockerfile: deploy/contabo/Dockerfile.backend, target: tools }
    restart: "no"
    environment: { DATABASE_URL: "postgresql://kow:${POSTGRES_PASSWORD}@postgres:5432/kingdoms_of_war" }
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

  backend:
    build: { context: ../.., dockerfile: deploy/contabo/Dockerfile.backend, target: app }
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "postgresql://kow:${POSTGRES_PASSWORD}@postgres:5432/kingdoms_of_war"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      TRUST_PROXY: "1"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:3001/live/bootstrap?platform=android' >/dev/null || exit 1"], interval: 15s, timeout: 5s, retries: 5, start_period: 30s }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  panel:
    build:
      context: ../..
      dockerfile: deploy/contabo/Dockerfile.panel
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?set in .env.production}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: https://${PANEL_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env.production}
      API_URL_INTERNAL: http://backend:3001
    depends_on: [backend]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  website:                       # public marketing site (static files served by a tiny Caddy), proxied by the main Caddy below
    build:
      context: ../..
      dockerfile: deploy/contabo/Dockerfile.website
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  caddy:                         # automatic HTTPS (Let's Encrypt); DNS of both domains must already point at this server
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { API_DOMAIN: "${API_DOMAIN}", PANEL_DOMAIN: "${PANEL_DOMAIN}", SITE_DOMAIN: "${SITE_DOMAIN:?set in .env.production}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [backend, panel, website]
    networks: [internal]

  backup:                        # daily pg_dump at 03:15, keeps BACKUP_KEEP_DAYS, reports to the panel (Yedekleme page)
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: kow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kingdoms_of_war
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AGENT_TOKEN: ${BACKUP_AGENT_TOKEN:-}
      REPORT_URL: http://backend:3001/backup/agent/report
    volumes: [./backup.sh:/backup.sh:ro, ./backups:/backups]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

networks:
  internal: {}
volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {} }
